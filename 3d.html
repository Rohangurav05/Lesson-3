<html>
    <head>
        <style>
            .start {
                background-color: rgb(121 82 179);
                border: none;
                border-radius: 3px;
                height: 25px;
                width: 90px;
              transition:0.3s;
            }
            .start:hover{
              background-color:green;
              box-shadow:8px 8px 120px grey;
            }
            .download{
                color: rgb(108 117 125);
                height: 25px;
                width: 100px;
              text-color:grey;
               border-radius:none;
              transition:0.3s;
              
            }
           .download:hover{
             background-color:green;
           }
        </style>
    </head>
    <body>
        <button class="start">Get Started</button>
        <button class="download">Download</button>
    </body>
</html>
